name: Deploy Hugo site to Pages

on:
  push:
    branches: ["main"]
  repository_dispatch:
    types: [submodule-updated] # Triggered automatically when submodules build

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Download pre-compiled assets from gorillaz-mountain release
      - name: Download gorillaz-mountain assets
        run: |
          mkdir -p static/muziek/gorillaz-mountain/dist
          curl -L -o dist.zip https://github.com/your-username/gorillaz-mountain/releases/download/latest/dist.zip
          unzip dist.zip -d static/muziek/gorillaz-mountain/
          rm dist.zip

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true

      - name: Build Hugo Site
        run: hugo --gc --minify

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public
