name: Deploy Hugo site to Pages

on:
  push:
    branches: ["main"]
  repository_dispatch:
    types: [submodule-updated]

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Download pre-compiled assets from gorillaz-mountain release
      - name: Download gorillaz-mountain assets
        run: |
          mkdir -p static/muziek/gorillaz-mountain
          curl -sSLf -o dist.zip "https://github.com/macabot/gorillaz-mountain/releases/download/latest/dist.zip"
          unzip -o dist.zip -d static/muziek/gorillaz-mountain/
          rm dist.zip

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true

      - name: Build Hugo Site
        run: hugo --gc --minify

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
