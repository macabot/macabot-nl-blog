baseURL = 'https://www.macabot.nl/'
languageCode = 'nl-nl'
theme = 'PaperMod'
title = 'macabot.nl'

# Enable raw HTML inside markdown (useful for custom audio/SVG tags)
[markup.goldmark.renderer]
unsafe = true

# ==============================================================================
# HUGO MODULE MOUNTS
# ==============================================================================
# Note: Defining custom mounts overrides Hugo defaults, so we must explicitly
# re-declare default mounts (content, static, etc.) alongside custom submodules.

[module]
# Default Hugo Mounts
[[module.mounts]]
source = 'content'
target = 'content'

[[module.mounts]]
source = 'static'
target = 'static'

[[module.mounts]]
source = 'layouts'
target = 'layouts'

# https://github.com/macabot/gorillaz-mountain/
#   Mount docs/ to /muziek/gorillaz-mountain/
[[module.mounts]]
source = "submodules/gorillaz-mountain/docs"
target = "content/muziek/gorillaz-mountain"
#   Mount dist/ to /muziek/gorillaz-mountain/dist/
[[module.mounts]]
source = "submodules/gorillaz-mountain/dist"
target = "content/muziek/gorillaz-mountain/dist"
