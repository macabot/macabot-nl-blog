baseURL = 'https://www.macabot.nl/'
languageCode = 'nl-nl'
theme = 'PaperMod'
title = 'macabot.nl'

# Enable raw HTML inside markdown (useful for custom audio/SVG tags)
[markup.goldmark.renderer]
unsafe = true

[params]
ShowBreadCrumbs = true

# ==============================================================================
# HUGO MODULE MOUNTS
# ==============================================================================
# Note: Defining custom mounts overrides Hugo defaults, so we must explicitly
# re-declare default mounts (content, static, etc.) alongside custom submodules.

[module]
# Default Hugo Mounts
[[module.mounts]]
source = 'content'
target = 'content'

[[module.mounts]]
source = 'static'
target = 'static'

[[module.mounts]]
source = 'layouts'
target = 'layouts'

# https://github.com/macabot/gorillaz-mountain/
[[module.mounts]]
source = "submodules/gorillaz-mountain/content"
target = "content/muziek/gorillaz-mountain"
[[module.mounts]]
source = "submodules/gorillaz-mountain/dist"
target = "content/muziek/gorillaz-mountain"

# https://github.com/macabot/ork-ork-ork
# [[module.mounts]]
# source = "submodules/ork-ork-ork/content"
# target = "content/muziek/ork-ork-ork"
# [[module.mounts]]
# source = "submodules/ork-ork-ork/dist"
# target = "content/muziek/ork-ork-ork"
